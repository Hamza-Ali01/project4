<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raqm — Urdu OCR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Nastaliq+Urdu:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #efe9de;
    --paper-raised: #f7f3ea;
    --ink: #1c1b1f;
    --ink-soft: #4d4a44;
    --ink-faint: #8a8577;
    --line: #d8cfbc;
    --rubric: #a13d2b;
    --rubric-soft: #a13d2b1a;
    --teal: #2f4858;
    --teal-soft: #2f48581a;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    background-image:
      radial-gradient(circle at 15% 8%, #00000006 0, transparent 45%),
      radial-gradient(circle at 90% 85%, #00000006 0, transparent 45%);
    color: var(--ink);
    font-family: "IBM Plex Sans", sans-serif;
    display: flex;
    justify-content: center;
    padding: 64px 20px 80px;
  }

  main{
    width: 100%;
    max-width: 620px;
  }

  /* ---------- Header ---------- */
  header{
    text-align: center;
    margin-bottom: 40px;
  }

  .eyebrow{
    font-size: 0.72rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--rubric);
    font-weight: 600;
    margin-bottom: 10px;
  }

  h1{
    font-family: "Fraunces", serif;
    font-weight: 600;
    font-size: 2.4rem;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  h1 .ur{
    font-family: "Noto Nastaliq Urdu", serif;
    font-weight: 700;
    font-size: 1.15em;
    margin-inline-start: 10px;
    color: var(--rubric);
  }

  .subtitle{
    color: var(--ink-soft);
    font-size: 0.98rem;
    max-width: 40ch;
    margin: 0 auto;
    line-height: 1.5;
  }

  .stroke{
    display: block;
    margin: 22px auto 0;
    width: 160px;
    height: 14px;
  }

  .stroke path{
    fill: none;
    stroke: var(--rubric);
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-dasharray: 220;
    stroke-dashoffset: 220;
    animation: draw 1.1s ease-out 0.15s forwards;
  }

  @keyframes draw{
    to{ stroke-dashoffset: 0; }
  }

  /* ---------- Card ---------- */
  .card{
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 28px;
    box-shadow: 0 1px 2px #00000008, 0 12px 30px -18px #00000022;
  }

  /* ---------- Dropzone ---------- */
  .dropzone{
    border: 1.5px dashed var(--line);
    border-radius: 10px;
    padding: 34px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color .18s ease, background .18s ease;
    position: relative;
    display: block;
  }

  .dropzone:hover,
  .dropzone.dragover{
    border-color: var(--rubric);
    background: var(--rubric-soft);
  }

  .dropzone input[type=file]{
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
  }

  .dz-icon{
    width: 34px;
    height: 34px;
    margin: 0 auto 12px;
    color: var(--ink-faint);
  }

  .dz-text{
    font-size: 0.92rem;
    color: var(--ink-soft);
  }

  .dz-text strong{
    color: var(--ink);
    font-weight: 600;
  }

  .dz-hint{
    font-size: 0.78rem;
    color: var(--ink-faint);
    margin-top: 4px;
  }

  .filename-chip{
    display: none;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
    padding: 8px 12px;
    background: var(--teal-soft);
    border: 1px solid #2f485833;
    border-radius: 8px;
    font-size: 0.85rem;
    color: var(--teal);
  }

  .filename-chip.visible{ display: flex; }

  .filename-chip svg{ width: 15px; height: 15px; flex-shrink: 0; }
  .filename-chip span{
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ---------- Button ---------- */
  .submit-btn{
    width: 100%;
    margin-top: 20px;
    padding: 13px 20px;
    background: var(--ink);
    color: var(--paper-raised);
    border: none;
    border-radius: 9px;
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    transition: background .15s ease, transform .1s ease;
  }

  .submit-btn:hover:not(:disabled){ background: var(--rubric); }
  .submit-btn:active:not(:disabled){ transform: scale(0.99); }

  .submit-btn:disabled{
    opacity: 0.65;
    cursor: not-allowed;
  }

  .submit-btn svg{ width: 17px; height: 17px; }

  /* ---------- Result ---------- */
  .result{
    margin-top: 26px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
    display: none;
  }

  .result.visible{ display: block; }

  .result-label{
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--ink-faint);
    font-weight: 600;
    margin-bottom: 8px;
  }

  .result img{
    max-width: 100%;
    max-height: 220px;
    display: block;
    margin: 0 auto 20px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: #fff;
  }

  .predicted-wrap{
    position: relative;
  }

  .predicted-text{
    direction: rtl;
    text-align: right;
    font-family: "Noto Nastaliq Urdu", serif;
    font-size: 1.5rem;
    line-height: 2.1;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 20px;
    min-height: 64px;
    word-wrap: break-word;
  }

  .copy-btn{
    position: absolute;
    top: 10px;
    left: 10px;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 5px 9px;
    font-size: 0.72rem;
    font-family: "IBM Plex Sans", sans-serif;
    color: var(--ink-soft);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .copy-btn:hover{ border-color: var(--teal); color: var(--teal); }
  .copy-btn svg{ width: 12px; height: 12px; }

  /* ---------- Error ---------- */
  .error{
    margin-top: 20px;
    color: var(--rubric);
    font-size: 0.88rem;
    background: var(--rubric-soft);
    border: 1px solid #a13d2b33;
    border-radius: 9px;
    padding: 13px 16px;
    display: none;
    align-items: flex-start;
    gap: 9px;
  }

  .error.visible{ display: flex; }
  .error svg{ width: 16px; height: 16px; flex-shrink: 0; margin-top: 1px; }

  footer{
    text-align: center;
    margin-top: 26px;
    font-size: 0.78rem;
    color: var(--ink-faint);
  }
</style>
</head>
<body>

<main>

  <header>
    <div class="eyebrow">Handwritten &amp; Printed Text</div>
    <h1>Raqm<span class="ur">رقم</span></h1>
    <p class="subtitle">Upload an image containing Urdu text and it will be transcribed for you.</p>
    <svg class="stroke" viewBox="0 0 160 14">
      <path d="M2 8 C 40 2, 60 13, 90 7 S 140 3, 158 9"/>
    </svg>
  </header>

  <div class="card">

    <form id="ocrForm">

      <label class="dropzone" id="dropzone">
        <input type="file" id="imageInput" accept=".png,.jpg,.jpeg,.bmp" required>
        <svg class="dz-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M4 16.5V18a2 2 0 002 2h12a2 2 0 002-2v-1.5M7 9l5-5 5 5M12 4v13" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="dz-text"><strong>Click to upload</strong> or drag an image here</div>
        <div class="dz-hint">PNG, JPG or BMP</div>
      </label>

      <div class="filename-chip" id="filenameChip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span id="filenameText"></span>
      </div>

      <button type="submit" id="submitBtn" class="submit-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M20 3l-11 11-4 7 7-4L23 6z" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span id="submitLabel">Recognize Text</span>
      </button>

    </form>

    <div class="error" id="errorBox">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01" stroke-linecap="round"/></svg>
      <span id="errorText"></span>
    </div>

    <div class="result" id="resultBox">

      <div class="result-label">Uploaded image</div>
      <img id="previewImg" alt="Uploaded image">

      <div class="result-label">Predicted text</div>
      <div class="predicted-wrap">
        <div class="predicted-text" id="predictedText"></div>
        <button type="button" class="copy-btn" id="copyBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/></svg>
          Copy
        </button>
      </div>

    </div>

  </div>

  <footer>Runs locally &middot; CRNN + CTC model</footer>

</main>

<script>
const ocrForm       = document.getElementById("ocrForm");
const imageInput    = document.getElementById("imageInput");
const dropzone      = document.getElementById("dropzone");
const submitBtn     = document.getElementById("submitBtn");
const submitLabel   = document.getElementById("submitLabel");

const resultBox      = document.getElementById("resultBox");
const previewImg     = document.getElementById("previewImg");
const predictedText  = document.getElementById("predictedText");

const errorBox  = document.getElementById("errorBox");
const errorText = document.getElementById("errorText");

const filenameChip = document.getElementById("filenameChip");
const filenameText = document.getElementById("filenameText");

const copyBtn = document.getElementById("copyBtn");

function resetPanels() {
  resultBox.classList.remove("visible");
  errorBox.classList.remove("visible");
  predictedText.textContent = "";
}

imageInput.addEventListener("change", function () {
  resetPanels();
  if (imageInput.files.length > 0) {
    const file = imageInput.files[0];
    filenameText.textContent = file.name;
    filenameChip.classList.add("visible");
    previewImg.src = URL.createObjectURL(file);
  } else {
    filenameChip.classList.remove("visible");
  }
});

["dragover", "dragenter"].forEach(evt =>
  dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.add("dragover"); })
);
["dragleave", "drop"].forEach(evt =>
  dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.remove("dragover"); })
);
dropzone.addEventListener("drop", function (e) {
  const file = e.dataTransfer.files[0];
  if (file) {
    imageInput.files = e.dataTransfer.files;
    imageInput.dispatchEvent(new Event("change"));
  }
});

ocrForm.addEventListener("submit", async function (event) {
  event.preventDefault();
  resetPanels();

  if (!imageInput.files || imageInput.files.length === 0) {
    errorText.textContent = "Please select an image first.";
    errorBox.classList.add("visible");
    return;
  }

  const imageFile = imageInput.files[0];
  previewImg.src = URL.createObjectURL(imageFile);

  submitBtn.disabled = true;
  submitLabel.textContent = "Reading…";

  try {
    const formData = new FormData();
    formData.append("image", imageFile);

    // Relative URL: works no matter which host/IP the page itself was loaded from.
    const response = await fetch("/predict", {
      method: "POST",
      body: formData
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "OCR prediction failed.");
    }

    predictedText.textContent = data.text || "No text recognized.";
    resultBox.classList.add("visible");

  } catch (error) {
    errorText.textContent = error.message || "Something went wrong while processing the image.";
    errorBox.classList.add("visible");
  }

  submitBtn.disabled = false;
  submitLabel.textContent = "Recognize Text";
});

copyBtn.addEventListener("click", async function () {
  try {
    await navigator.clipboard.writeText(predictedText.textContent);
    const original = copyBtn.innerHTML;
    copyBtn.textContent = "Copied";
    setTimeout(() => { copyBtn.innerHTML = original; }, 1200);
  } catch (e) { /* clipboard unavailable — ignore silently */ }
});
</script>

</body>
</html>
